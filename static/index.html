<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stackdetect</title>
<style>
  :root {
    /* Orchestra brand palette */
    --brand-bg:#2E3FB0;
    --brand-bg-deep:#1F2C8A;
    --brand-accent:#4C6EF5;
    --brand-accent-soft:#A9C0FF;
    --surface:#FFFFFF;
    --surface-alt:#F4F6FF;
    --text-on-brand:#FFFFFF;
    --text-body:#1A1F36;

    /* Derived neutrals for white surfaces */
    --line:#E2E7F5;
    --line-strong:#CFD7EE;
    --muted:#5C6784;
    --dim:#8A93AC;

    /* Semantic trigger colours — kept deliberately non-brand so HOT/WARM/COLD
       stay instantly legible rather than blending into the blue theme. */
    --hot:#B3261E;      --hot-bg:#FDECEA;  --hot-line:#F0C4BF;
    --warm:#8A5300;     --warm-bg:#FFF4E0; --warm-line:#F2DCB0;
    --cold:#5A6478;     --cold-bg:#EEF1F8; --cold-line:#DBE1EF;
    --ok-green:#177245;
    --err:#B3261E;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:36px 24px 80px;
    background:var(--brand-bg); color:var(--text-on-brand);
    font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1280px; margin:0 auto; }

  /* Announcement-bar style band, flat, no gradient or shadow. */
  header {
    background:var(--brand-bg-deep); border-radius:12px;
    padding:30px 32px; margin-bottom:26px;
  }
  h1 {
    margin:0 0 14px; font-size:30px; line-height:1.15; font-weight:700;
    letter-spacing:-.022em; color:var(--text-on-brand);
  }
  .method {
    display:inline-block; padding:0; border:0; background:none;
    color:var(--text-on-brand); font-size:14.5px; font-weight:650;
    letter-spacing:.005em;
  }
  .tagline {
    margin:8px 0 0; color:var(--brand-accent-soft);
    font-size:14px; font-weight:500; letter-spacing:.005em;
  }

  /* Input card on a white surface. */
  .panel {
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:20px; color:var(--text-body);
  }
  textarea {
    width:100%; min-height:108px; padding:12px 13px;
    border:1px solid var(--line-strong); border-radius:8px;
    background:var(--surface-alt); color:var(--text-body); resize:vertical;
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  textarea:focus { outline:none; border-color:var(--brand-accent); background:var(--surface); }
  textarea::placeholder { color:var(--dim); }
  .controls { display:flex; align-items:center; gap:18px; margin-top:14px; flex-wrap:wrap; }
  button {
    padding:10px 24px; border:0; border-radius:8px;
    background:var(--brand-accent); color:#FFFFFF;
    font-size:13.5px; font-weight:650; cursor:pointer; letter-spacing:.01em;
  }
  button:hover:not([disabled]) { background:#3D5CE0; }
  button[disabled] { opacity:.5; cursor:default; }
  #status { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .credits {
    margin-left:auto; color:var(--muted); font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }

  /* Results table on a white surface. */
  .tablewrap {
    margin-top:22px; overflow-x:auto;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
  }
  table { width:100%; border-collapse:collapse; font-size:13px; color:var(--text-body); }
  thead th {
    position:sticky; top:0; z-index:1;
    background:var(--surface-alt); color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:.075em; font-weight:700;
    text-align:left; padding:12px 16px; border-bottom:1px solid var(--line-strong);
    white-space:nowrap;
  }
  tbody td { padding:15px 16px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:nth-child(even) { background:var(--surface-alt); }
  tbody tr:last-child td { border-bottom:0; }

  /* Confirmed running: a live host resolves. Kept visually louder than every
     other row because it is the one claim that never moves between scans. */
  tbody tr.confirmed { background:var(--hot-bg); }
  tbody tr.confirmed td:first-child { box-shadow:inset 4px 0 0 var(--hot); }
  .domain { font-weight:650; color:var(--text-body); }

  .pill {
    display:inline-block; padding:4px 11px; border-radius:999px;
    font-size:11px; font-weight:800; letter-spacing:.06em;
  }
  .pill.HOT  { background:var(--hot);  color:#FFFFFF; border:1px solid var(--hot); }
  .pill.WARM { background:var(--warm-bg); color:var(--warm); border:1px solid var(--warm-line); }
  .pill.COLD { background:var(--cold-bg); color:var(--cold); border:1px solid var(--cold-line); }
  .pill.EXCLUDED { background:#FFFFFF; color:var(--muted); border:1px dashed var(--line-strong); }
  .basis { display:block; margin-top:6px; font-size:11px; font-weight:700; letter-spacing:.01em; }
  .basis.confirmed_running { color:var(--hot); }
  .basis.likely_running { color:var(--warm); }
  .basis.named_only { color:var(--muted); font-weight:600; }

  .tool {
    display:inline-block; margin:0 6px 6px 0; padding:4px 10px; border-radius:6px;
    background:var(--surface-alt); border:1px solid var(--line-strong);
    font-size:12px; color:var(--text-body);
  }
  tbody tr:nth-child(even) .tool, tbody tr.confirmed .tool { background:var(--surface); }
  .tool.selfhosted {
    background:#FFFFFF; border-color:var(--hot-line); color:var(--hot); font-weight:600;
  }
  .badge {
    margin-left:7px; padding:2px 6px; border-radius:4px;
    background:var(--hot); color:#FFFFFF;
    font-size:9.5px; font-weight:800; letter-spacing:.06em; vertical-align:1px;
  }

  .evidence {
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    font-size:11.5px; color:var(--text-body); line-height:1.7;
    max-width:440px; word-break:break-word;
  }
  .evidence .why {
    color:var(--muted); font-family:ui-sans-serif,-apple-system,"Segoe UI",sans-serif;
    font-size:11px; margin-top:4px;
  }
  .sig {
    display:block; font-size:11px;
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    color:var(--muted); white-space:nowrap; line-height:1.7;
  }
  .sig b { font-weight:700; color:var(--dim); }
  .sig .ok  { color:var(--ok-green); font-weight:600; }
  .sig .bad { color:var(--warm); font-weight:600; }
  .sig .err { color:var(--err); font-weight:600; }
  .muted { color:var(--dim); }
  .empty { padding:34px 16px; text-align:center; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>stackdetect</h1>
    <span class="method">Method: DNS + Certificate Transparency</span>
    <p class="tagline">We don't buy technographics, we resolve them.</p>
  </header>

  <div class="panel">
    <textarea id="domains" spellcheck="false" placeholder="one per line — domain or full URL, pasted straight from a spreadsheet is fine
nubank.com.br
https://international.nubank.com.br/
www.monzo.com
gocardless.com/careers"></textarea>
    <div class="controls">
      <button id="scan">Scan</button>
      <span id="status"></span>
      <span class="credits" id="credits">apollo 0/300 · parallel 0/300</span>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Trigger</th>
          <th>Data tools detected</th>
          <th>Evidence</th>
          <th>Signals</th>
        </tr>
      </thead>
      <tbody id="results">
        <tr><td colspan="5" class="empty">No scans yet — paste domains above and hit Scan.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const CHUNK = 5;                       // matches the server's concurrency cap
const LEVEL_ORDER = { HOT:0, WARM:1, COLD:2, EXCLUDED:3 };
const BASIS_LABEL = {
  confirmed_running: "confirmed running",
  likely_running:    "likely running",
  named_only:        "named only"
};

const btn = document.getElementById("scan");
const statusEl = document.getElementById("status");
const creditsEl = document.getElementById("credits");
const tbody = document.getElementById("results");
let rows = [];

// Accept anything reasonable: full URLs, www prefixes, paths, ports, mixed
// case. The server reduces each host to its registrable root (it needs the
// Public Suffix List for multi-part TLDs like .com.br) — this just gets a
// clean host onto the wire.
function normaliseLine(line) {
  let t = (line || "").trim().toLowerCase();
  if (!t) return "";
  if (t.indexOf("//") !== -1) t = t.split("//")[1];
  if (t.indexOf("@") !== -1) t = t.substring(t.lastIndexOf("@") + 1);
  t = t.split("/")[0].split("?")[0].split("#")[0].split(":")[0];
  t = t.trim().replace(/\.+$/, "");
  if (t.indexOf("www.") === 0) t = t.substring(4);
  return t;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function triggerCell(v) {
  const td = el("td");
  td.appendChild(el("span", "pill " + v.trigger_level, v.trigger_level));
  if (v.trigger_basis) {
    td.appendChild(el("span", "basis " + v.trigger_basis, BASIS_LABEL[v.trigger_basis]));
  }
  return td;
}

function toolsCell(v) {
  const td = el("td");
  if (!v.tools.length) { td.appendChild(el("span", "muted", "—")); return td; }
  v.tools.forEach(function (t) {
    const chip = el("span", "tool" + (t.self_hosted ? " selfhosted" : ""), t.tool);
    if (t.self_hosted_orchestrator) chip.appendChild(el("span", "badge", "SELF-HOSTED"));
    td.appendChild(chip);
  });
  return td;
}

// The defensible proof. Prefer what drove the trigger; fall back to the
// strongest stack evidence so a COLD row is still explainable.
function evidenceCell(v) {
  const td = el("td", "evidence");
  if (v.trigger_evidence && v.trigger_evidence.length) {
    v.trigger_evidence.slice(0, 3).forEach(function (e) {
      td.appendChild(el("div", "why", e.reason));
      td.appendChild(el("div", null, e.detail));
    });
  } else if (v.tools.length) {
    td.appendChild(el("div", "why", "strongest stack evidence"));
    td.appendChild(el("div", null, v.tools[0].evidence));
  } else {
    td.appendChild(el("span", "muted", "—"));
  }
  return td;
}

// Which detectors fired — so a genuine COLD is distinguishable from a COLD
// caused by a detector that was down.
function signalsCell(v) {
  const td = el("td");
  const s = v.signals_summary || {};
  [["ct", s.ct_logs], ["dns", s.dns], ["careers", s.careers]].forEach(function (pair) {
    const line = el("span", "sig");
    line.appendChild(el("b", null, pair[0] + " "));
    const state = pair[1] || "not_run";
    const cls = state === "ok" ? "ok" : (state === "error" ? "err" : "bad");
    line.appendChild(el("span", cls, state));
    td.appendChild(line);
  });
  if (s.data_role_count) {
    td.appendChild(el("span", "sig", "roles " + s.data_role_count));
  }
  return td;
}

function render() {
  rows.sort(function (a, b) {
    const d = (LEVEL_ORDER[a.trigger_level] ?? 9) - (LEVEL_ORDER[b.trigger_level] ?? 9);
    if (d) return d;
    // Confirmed-running above likely-running within HOT.
    const ac = a.self_hosted_orchestrator ? 0 : 1, bc = b.self_hosted_orchestrator ? 0 : 1;
    if (ac !== bc) return ac - bc;
    if (b.tools.length !== a.tools.length) return b.tools.length - a.tools.length;
    return a.domain.localeCompare(b.domain);
  });

  tbody.innerHTML = "";
  if (!rows.length) {
    const tr = el("tr"); const td = el("td", "empty", "No results.");
    td.colSpan = 5; tr.appendChild(td); tbody.appendChild(tr); return;
  }
  rows.forEach(function (v) {
    const tr = el("tr", v.trigger_basis === "confirmed_running" ? "confirmed" : "");
    const first = el("td"); first.appendChild(el("span", "domain", v.domain));
    tr.appendChild(first);
    tr.appendChild(triggerCell(v));
    tr.appendChild(toolsCell(v));
    tr.appendChild(evidenceCell(v));
    tr.appendChild(signalsCell(v));
    tbody.appendChild(tr);
  });
}

function showCredits(c) {
  if (!c) return;
  creditsEl.textContent =
    "apollo " + c.apollo_used + "/" + c.apollo_cap +
    " · parallel " + c.parallel_used + "/" + c.parallel_cap;
}

btn.addEventListener("click", async function () {
  const domains = document.getElementById("domains").value
    .split("\n").map(normaliseLine).filter(Boolean)
    .filter(function (d, i, all) { return all.indexOf(d) === i; });

  if (!domains.length) { statusEl.textContent = "Enter at least one domain."; return; }

  rows = []; render();
  btn.disabled = true;
  let done = 0;

  // Chunked so progress is real: each chunk is one /scan_batch call, and the
  // table fills in as chunks land instead of after everything finishes.
  for (let i = 0; i < domains.length; i += CHUNK) {
    const chunk = domains.slice(i, i + CHUNK);
    statusEl.textContent = "scanning " + (done + 1) + "–" +
      Math.min(done + chunk.length, domains.length) + " of " + domains.length + "…";
    try {
      const res = await fetch("/scan_batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domains: chunk })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      rows = rows.concat(data.verdicts || []);
      showCredits(data.credits);
    } catch (err) {
      chunk.forEach(function (d) {
        rows.push({
          domain: d, tools: [], trigger_level: "COLD", trigger_basis: null,
          trigger_evidence: [{ reason: "scan failed", detail: String(err.message) }],
          self_hosted_orchestrator: false,
          signals_summary: { ct_logs: "error", dns: "error", careers: "error" }
        });
      });
    }
    done += chunk.length;
    render();
  }

  const hot = rows.filter(function (r) { return r.trigger_level === "HOT"; }).length;
  const confirmed = rows.filter(function (r) { return r.trigger_basis === "confirmed_running"; }).length;
  statusEl.textContent = "done — " + rows.length + " scanned, " + hot +
    " HOT (" + confirmed + " confirmed running)";
  btn.disabled = false;
});
</script>
</body>
</html>
