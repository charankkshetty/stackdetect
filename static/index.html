<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stackdetect</title>
<style>
  :root {
    --bg:#0b0e13; --panel:#141922; --panel-2:#1b212c; --line:#252d3a;
    --text:#e8eef6; --muted:#8b98ab; --dim:#5d6a7d;
    --accent:#4ea1ff;
    --hot:#ff5c5c; --hot-bg:#3a1414;
    --warm:#f0a92b; --warm-bg:#332612;
    --cold:#7d8a9c; --cold-bg:#1c222c;
    --ok:#39d98a; --err:#ff5c5c;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; padding:40px 24px 80px; background:var(--bg); color:var(--text);
    font:14px/1.55 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap { max-width:1280px; margin:0 auto; }
  header { margin-bottom:26px; }
  h1 { margin:0 0 10px; font-size:26px; letter-spacing:-.02em; font-weight:700; }
  .method {
    display:inline-block; padding:6px 13px; border:1px solid #2b4a6f; border-radius:999px;
    background:#0f1e2e; color:#7dc0ff;
    font-size:12.5px; font-weight:650; letter-spacing:.01em;
  }
  .tagline { margin:10px 0 0; color:var(--muted); font-size:13px; }

  .panel { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:16px; }
  textarea {
    width:100%; min-height:104px; padding:11px 12px; border:1px solid var(--line);
    border-radius:7px; background:var(--bg); color:var(--text); resize:vertical;
    font:13px/1.6 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  textarea:focus { outline:none; border-color:#38506e; }
  .controls { display:flex; align-items:center; gap:16px; margin-top:12px; flex-wrap:wrap; }
  button {
    padding:9px 20px; border:0; border-radius:7px; background:var(--accent);
    color:#04121f; font-size:13.5px; font-weight:700; cursor:pointer;
  }
  button:hover:not([disabled]) { background:#6bb2ff; }
  button[disabled] { opacity:.45; cursor:default; }
  #status { color:var(--muted); font-size:12.5px; font-variant-numeric:tabular-nums; }
  .credits {
    margin-left:auto; color:var(--dim); font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .tablewrap { margin-top:22px; overflow-x:auto; border:1px solid var(--line); border-radius:10px; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  thead th {
    position:sticky; top:0; background:var(--panel-2); color:var(--muted);
    font-size:11px; text-transform:uppercase; letter-spacing:.07em; font-weight:650;
    text-align:left; padding:10px 14px; border-bottom:1px solid var(--line); white-space:nowrap;
  }
  tbody td { padding:13px 14px; border-bottom:1px solid var(--line); vertical-align:top; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr.confirmed { background:linear-gradient(90deg,rgba(255,92,92,.07),transparent 60%); }
  tbody tr.confirmed td:first-child { box-shadow:inset 3px 0 0 var(--hot); }
  .domain { font-weight:650; }

  .pill {
    display:inline-block; padding:3px 10px; border-radius:999px;
    font-size:11px; font-weight:750; letter-spacing:.05em;
  }
  .pill.HOT { background:var(--hot-bg); color:var(--hot); border:1px solid #5e2020; }
  .pill.WARM { background:var(--warm-bg); color:var(--warm); border:1px solid #5a4416; }
  .pill.COLD { background:var(--cold-bg); color:var(--cold); border:1px solid #2a3340; }
  .pill.EXCLUDED { background:#16181d; color:var(--dim); border:1px solid #262a32; }
  .basis { display:block; margin-top:5px; font-size:11px; font-weight:600; }
  .basis.confirmed_running { color:var(--hot); }
  .basis.likely_running { color:var(--warm); }
  .basis.named_only { color:var(--dim); }

  .tool { display:inline-block; margin:0 5px 5px 0; padding:3px 9px; border-radius:5px;
          background:var(--panel-2); border:1px solid var(--line); font-size:12px; }
  .tool.selfhosted { border-color:#5e2020; background:var(--hot-bg); color:#ffb3b3; }
  .badge { margin-left:6px; padding:1px 5px; border-radius:3px; background:var(--hot);
           color:#2a0a0a; font-size:9.5px; font-weight:800; letter-spacing:.05em; vertical-align:1px; }

  .evidence { font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:11.5px;
              color:#c3d0e0; line-height:1.65; max-width:430px; word-break:break-word; }
  .evidence .why { color:var(--dim); }
  .sig { display:block; font-size:11px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
         color:var(--dim); white-space:nowrap; }
  .sig b { font-weight:600; }
  .sig .ok { color:var(--ok); } .sig .bad { color:var(--warm); } .sig .err { color:var(--err); }
  .muted { color:var(--dim); }
  .empty { padding:26px 14px; text-align:center; color:var(--dim); font-size:13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>stackdetect</h1>
    <span class="method">Method: DNS + Certificate Transparency</span>
    <p class="tagline">We don't buy technographics, we resolve them.</p>
  </header>

  <div class="panel">
    <textarea id="domains" spellcheck="false" placeholder="one per line — domain or full URL, pasted straight from a spreadsheet is fine
nubank.com.br
https://international.nubank.com.br/
www.monzo.com
gocardless.com/careers"></textarea>
    <div class="controls">
      <button id="scan">Scan</button>
      <span id="status"></span>
      <span class="credits" id="credits">apollo 0/300 · parallel 0/300</span>
    </div>
  </div>

  <div class="tablewrap">
    <table>
      <thead>
        <tr>
          <th>Company</th>
          <th>Trigger</th>
          <th>Data tools detected</th>
          <th>Evidence</th>
          <th>Signals</th>
        </tr>
      </thead>
      <tbody id="results">
        <tr><td colspan="5" class="empty">No scans yet — paste domains above and hit Scan.</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const CHUNK = 5;                       // matches the server's concurrency cap
const LEVEL_ORDER = { HOT:0, WARM:1, COLD:2, EXCLUDED:3 };
const BASIS_LABEL = {
  confirmed_running: "confirmed running",
  likely_running:    "likely running",
  named_only:        "named only"
};

const btn = document.getElementById("scan");
const statusEl = document.getElementById("status");
const creditsEl = document.getElementById("credits");
const tbody = document.getElementById("results");
let rows = [];

// Accept anything reasonable: full URLs, www prefixes, paths, ports, mixed
// case. The server reduces each host to its registrable root (it needs the
// Public Suffix List for multi-part TLDs like .com.br) — this just gets a
// clean host onto the wire.
function normaliseLine(line) {
  let t = (line || "").trim().toLowerCase();
  if (!t) return "";
  if (t.indexOf("//") !== -1) t = t.split("//")[1];
  if (t.indexOf("@") !== -1) t = t.substring(t.lastIndexOf("@") + 1);
  t = t.split("/")[0].split("?")[0].split("#")[0].split(":")[0];
  t = t.trim().replace(/\.+$/, "");
  if (t.indexOf("www.") === 0) t = t.substring(4);
  return t;
}

function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined) n.textContent = text;
  return n;
}

function triggerCell(v) {
  const td = el("td");
  td.appendChild(el("span", "pill " + v.trigger_level, v.trigger_level));
  if (v.trigger_basis) {
    td.appendChild(el("span", "basis " + v.trigger_basis, BASIS_LABEL[v.trigger_basis]));
  }
  return td;
}

function toolsCell(v) {
  const td = el("td");
  if (!v.tools.length) { td.appendChild(el("span", "muted", "—")); return td; }
  v.tools.forEach(function (t) {
    const chip = el("span", "tool" + (t.self_hosted ? " selfhosted" : ""), t.tool);
    if (t.self_hosted_orchestrator) chip.appendChild(el("span", "badge", "SELF-HOSTED"));
    td.appendChild(chip);
  });
  return td;
}

// The defensible proof. Prefer what drove the trigger; fall back to the
// strongest stack evidence so a COLD row is still explainable.
function evidenceCell(v) {
  const td = el("td", "evidence");
  if (v.trigger_evidence && v.trigger_evidence.length) {
    v.trigger_evidence.slice(0, 3).forEach(function (e) {
      td.appendChild(el("div", "why", e.reason));
      td.appendChild(el("div", null, e.detail));
    });
  } else if (v.tools.length) {
    td.appendChild(el("div", "why", "strongest stack evidence"));
    td.appendChild(el("div", null, v.tools[0].evidence));
  } else {
    td.appendChild(el("span", "muted", "—"));
  }
  return td;
}

// Which detectors fired — so a genuine COLD is distinguishable from a COLD
// caused by a detector that was down.
function signalsCell(v) {
  const td = el("td");
  const s = v.signals_summary || {};
  [["ct", s.ct_logs], ["dns", s.dns], ["careers", s.careers]].forEach(function (pair) {
    const line = el("span", "sig");
    line.appendChild(el("b", null, pair[0] + " "));
    const state = pair[1] || "not_run";
    const cls = state === "ok" ? "ok" : (state === "error" ? "err" : "bad");
    line.appendChild(el("span", cls, state));
    td.appendChild(line);
  });
  if (s.data_role_count) {
    td.appendChild(el("span", "sig", "roles " + s.data_role_count));
  }
  return td;
}

function render() {
  rows.sort(function (a, b) {
    const d = (LEVEL_ORDER[a.trigger_level] ?? 9) - (LEVEL_ORDER[b.trigger_level] ?? 9);
    if (d) return d;
    // Confirmed-running above likely-running within HOT.
    const ac = a.self_hosted_orchestrator ? 0 : 1, bc = b.self_hosted_orchestrator ? 0 : 1;
    if (ac !== bc) return ac - bc;
    if (b.tools.length !== a.tools.length) return b.tools.length - a.tools.length;
    return a.domain.localeCompare(b.domain);
  });

  tbody.innerHTML = "";
  if (!rows.length) {
    const tr = el("tr"); const td = el("td", "empty", "No results.");
    td.colSpan = 5; tr.appendChild(td); tbody.appendChild(tr); return;
  }
  rows.forEach(function (v) {
    const tr = el("tr", v.trigger_basis === "confirmed_running" ? "confirmed" : "");
    const first = el("td"); first.appendChild(el("span", "domain", v.domain));
    tr.appendChild(first);
    tr.appendChild(triggerCell(v));
    tr.appendChild(toolsCell(v));
    tr.appendChild(evidenceCell(v));
    tr.appendChild(signalsCell(v));
    tbody.appendChild(tr);
  });
}

function showCredits(c) {
  if (!c) return;
  creditsEl.textContent =
    "apollo " + c.apollo_used + "/" + c.apollo_cap +
    " · parallel " + c.parallel_used + "/" + c.parallel_cap;
}

btn.addEventListener("click", async function () {
  const domains = document.getElementById("domains").value
    .split("\n").map(normaliseLine).filter(Boolean)
    .filter(function (d, i, all) { return all.indexOf(d) === i; });

  if (!domains.length) { statusEl.textContent = "Enter at least one domain."; return; }

  rows = []; render();
  btn.disabled = true;
  let done = 0;

  // Chunked so progress is real: each chunk is one /scan_batch call, and the
  // table fills in as chunks land instead of after everything finishes.
  for (let i = 0; i < domains.length; i += CHUNK) {
    const chunk = domains.slice(i, i + CHUNK);
    statusEl.textContent = "scanning " + (done + 1) + "–" +
      Math.min(done + chunk.length, domains.length) + " of " + domains.length + "…";
    try {
      const res = await fetch("/scan_batch", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ domains: chunk })
      });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      rows = rows.concat(data.verdicts || []);
      showCredits(data.credits);
    } catch (err) {
      chunk.forEach(function (d) {
        rows.push({
          domain: d, tools: [], trigger_level: "COLD", trigger_basis: null,
          trigger_evidence: [{ reason: "scan failed", detail: String(err.message) }],
          self_hosted_orchestrator: false,
          signals_summary: { ct_logs: "error", dns: "error", careers: "error" }
        });
      });
    }
    done += chunk.length;
    render();
  }

  const hot = rows.filter(function (r) { return r.trigger_level === "HOT"; }).length;
  const confirmed = rows.filter(function (r) { return r.trigger_basis === "confirmed_running"; }).length;
  statusEl.textContent = "done — " + rows.length + " scanned, " + hot +
    " HOT (" + confirmed + " confirmed running)";
  btn.disabled = false;
});
</script>
</body>
</html>
